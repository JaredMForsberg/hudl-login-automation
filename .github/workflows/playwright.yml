# Playwright CI workflow for the Hudl login automation project.
#
# Runs manually through GitHub Actions to avoid triggering
# authenticated tests on every repository update.
#
# HUDL_EMAIL and HUDL_PASSWORD are supplied through GitHub
# Actions Secrets rather than being stored in source control.
#
# Installs dependencies and browser binaries, executes the
# cross-browser test suite, and uploads the HTML test report
# for reviewing execution results.
name: Playwright Tests

on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          HUDL_EMAIL: ${{ secrets.HUDL_EMAIL }}
          HUDL_PASSWORD: ${{ secrets.HUDL_PASSWORD }}
        run: npx playwright test --workers=2

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
